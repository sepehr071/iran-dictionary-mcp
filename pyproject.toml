[project]
name = "iran-dictionary-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for Persian dictionaries Abadis and Vajehyab: Dehkhoda, Moein, Amid, synonyms, antonyms, English and Arabic translation, names."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sepehr Radmard", email = "sepehrr80@gmail.com" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "abadis", "vajehyab", "dictionary", "persian-dictionary", "dehkhoda", "moein", "amid", "synonyms", "antonyms", "translation", "persian-names", "iran", "claude", "persian", "farsi", "ai-agents", "mcp-server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "httpx-curl-cffi>=0.1.5",
    "curl-cffi>=0.16.3",
    "beautifulsoup4>=4.12",
]

[project.urls]
Homepage = "https://github.com/sepehr071/iran-dictionary-mcp"
Repository = "https://github.com/sepehr071/iran-dictionary-mcp"
Issues = "https://github.com/sepehr071/iran-dictionary-mcp/issues"
Website = "https://mcpfarsi.ir/"

[project.scripts]
iran-dictionary-mcp = "iran_dictionary_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iran_dictionary_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real Abadis and Vajehyab sites (run with -m live)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long Field(description=...) strings read better on one line
